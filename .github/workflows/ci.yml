name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      # Private repo checkout needs a PAT with contents:read on sdwianto/sales.
      # Repo secret: SALES_REPO_TOKEN (fine-grained or classic with repo scope).
      - name: Checkout Sales platform packages
        uses: actions/checkout@v5
        with:
          repository: sdwianto/sales
          ref: main
          path: _vendor/sales
          token: ${{ secrets.SALES_REPO_TOKEN }}

      - name: Pack @sdwianto platform tarballs
        run: |
          cd _vendor/sales
          npm install
          npm run ee12:pack

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck @sdwianto packages
        run: npm run typecheck:packages

      - name: EE-12 platform consumer gate
        run: npm run test:execution:ee12

      - name: EE-13 registry prod gate
        run: npm run test:execution:ee13

      - name: EE-14 events consumer gate
        run: npm run test:execution:ee14

      - name: Execution boundary check
        run: npm run check:execution-boundary

      - name: Execution boundary check (strict)
        run: npm run check:execution-boundary:strict
        continue-on-error: true

      - name: Strict typecheck (core modules)
        run: npm run typecheck:strict

      - name: Unit tests
        run: npm run test:unit

      - name: FP enterprise smoke gate
        run: npm run test:fp:enterprise

      - name: Multi-UOM regression suite
        run: npm run test:multi-uom

      - name: P1 regression suite
        run: npm run test:p1

      - name: P3 regression suite
        run: npm run test:p3

      - name: S3 stabilization suite
        run: npm run test:s3

      - name: Build
        run: npm run build
        env:
          MONGO_URL: mongodb://127.0.0.1:27017
          SESSION_SECRET: ci-session-secret-min-32-characters-xx

  e2e:
    runs-on: ubuntu-latest
    needs: quality
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Checkout Sales platform packages
        uses: actions/checkout@v5
        with:
          repository: sdwianto/sales
          ref: main
          path: _vendor/sales
          token: ${{ secrets.SALES_REPO_TOKEN }}

      - name: Pack @sdwianto platform tarballs
        run: |
          cd _vendor/sales
          npm install
          npm run ee12:pack

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: E2E tests
        run: npx playwright test
        env:
          CI: true
          APP_HOST: 127.0.0.1
          APP_PORT: '3001'
          MONGO_URL: mongodb://127.0.0.1:27017
          DB_NAME: inventory_e2e_ci
          SESSION_SECRET: ci-session-secret-min-32-characters-xx
          MASTER_BOOTSTRAP_EMAIL: master@dawam.com
          MASTER_BOOTSTRAP_PASSWORD: ci-e2e-bootstrap-password-min-16
          E2E_MASTER_EMAIL: master@dawam.com
          E2E_MASTER_PASSWORD: ci-e2e-bootstrap-password-min-16
